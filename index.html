<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Perfil</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #060608 0%, #121317 45%, #1c1f25 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #f3f4f6;
      }

      .card {
        width: min(92vw, 420px);
        padding: 32px 24px;
        background: rgba(18, 18, 22, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      .avatar {
        width: 120px;
        height: 120px;
        margin: 0 auto 18px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid #4b5563;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      h1 {
        margin: 6px 0 8px;
        font-size: 1.35rem;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #9ca3af;
        font-size: 0.95rem;
      }

      .buttons {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr;
      }

      .btn {
        display: block;
        padding: 14px 18px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      }

      .btn.github {
        background: linear-gradient(135deg, #2f3440, #23262e);
      }

      .btn.youtube {
        background: linear-gradient(135deg, #ff4d4f, #b30000);
      }

      .btn.contact {
        background: linear-gradient(135deg, #778c43, #586e26);
    
      }
      .btn.paypal {
        background: linear-gradient(135deg, #aa7444, #704214);
    
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar">
        <img src="foto.webp" alt="Foto de perfil" />
      </div>
      <h1>Antony Delgado</h1>
      <p class="subtitle">Curioso · Programador · Autodidacta</p>

      <div class="buttons">
        <a class="btn github" href="proyectos.html">Proyectos</a>
        <a class="btn youtube" href="https://www.youtube.com/channel/UCBAAryfh5W3py_qIckTP1ZA" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a class="btn contact" href="mailto:delgadoantony95@gmail.com">Contacto</a>
        <a class="btn paypal" href="https://www.paypal.me/Anyony" target="_blank" rel="noopener noreferrer">Un Cafesito</a>
      </div>
    </div>
  </body>
</html>
