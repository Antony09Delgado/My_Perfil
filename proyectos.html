<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #060608 0%, #121317 45%, #1c1f25 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #f3f4f6;
      }

      .card {
        width: min(92vw, 460px);
        padding: 32px 24px;
        background: rgba(18, 18, 22, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      h1 {
        margin: 6px 0 8px;
        font-size: 1.45rem;
      }

      .subtitle {
        margin: 0 0 24px;
        color: #9ca3af;
        font-size: 0.95rem;
      }

      .buttons {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr;
      }

      .btn {
        display: block;
        padding: 14px 18px;
        border-radius: 14px;
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      }

      .btn.github {
        background: linear-gradient(135deg, #2f3440, #23262e);
      }

      .btn.project{
        background: linear-gradient(135deg,  #778c43, #586e26);
      }

      .top-link {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        text-align: left;
        font-size: 1.15rem;
        color: #cbd5e1;
        text-decoration: none;
      }

      .back {
        margin-top: 18px;
        display: inline-block;
        color: #cbd5e1;
        text-decoration: none;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a class="top-link" href="index.html" aria-label="Volver al perfil">←</a>
      <h1>Mis proyectos</h1>
      <p class="subtitle">Aquí los tienes organizados y listos para empenzar a trabajar</p>

      <div class="buttons">
        <a class="btn github" href="https://github.com/Antony09Delgado" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a class="btn project" href="#">Proyecto 1: </a>
      </div>

      <a class="back" href="index.html">← Volver al perfil</a>
    </div>
  </body>
</html>
